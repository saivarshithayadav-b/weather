<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>random password is: <span id="hell"></span></p>
    <button onclick="generate()">generate password</button>
    <script>
        function generate(){
            var
            passwordlist="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ@#$&_!",password=[]
           // console.log(passwordlist.charAt)
           for (i=1;i<=6;i++){
            var 
            randomNumber=Math.floor(Math.random()*passwordlist.length)
            var 
            randomCharacter=passwordlist.charAt(randomNumber)
            password.push(randomCharacter)
           }
           password=password.join(" ")
           console.log(password)
           document.getElementById("hell").
           innerHTML=password
        }
    </script>
</body>
</html>
